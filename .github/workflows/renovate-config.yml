name: Renovate config

# Scoped to the renovate files: the validator is a 650 MiB closure, and
# nothing outside these paths can invalidate the config. The lists are
# duplicated because GitHub Actions does not support YAML anchors.
on:
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
      - .github/workflows/renovate-config.yml
  push:
    branches: [main]
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
      - .github/workflows/renovate-config.yml

permissions:
  contents: read

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deliberately not a required check on main. A path-filtered workflow never
  # reports on the PRs it skips, so requiring it would leave every PR that
  # doesn't touch these files permanently blocked.
  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --inputs-from pins the validator to this flake's nixpkgs, so CI and
      # a local run agree on the version. Catches unknown options and wrong
      # types; it does not catch preset semantics, which is what the dry run
      # in renovate.yml is for.
      - name: Validate renovate.json
        run: nix shell --inputs-from . nixpkgs#renovate --command renovate-config-validator

      # renovate-config-validator does not reject duplicate keys, and neither
      # does a plain JSON parse: both silently keep the last value. Renovate
      # itself does reject them, by opening a "Fix Renovate Configuration"
      # issue and refusing to raise any PR until it is resolved.
      - name: Reject duplicate keys in renovate.json
        run: |
          python3 - <<'EOF'
          import collections, json, sys

          def no_duplicates(pairs):
              counts = collections.Counter(key for key, _ in pairs)
              repeated = sorted(key for key, n in counts.items() if n > 1)
              if repeated:
                  sys.exit(f"duplicate keys in renovate.json: {repeated}")
              return dict(pairs)

          with open("renovate.json") as handle:
              json.load(handle, object_pairs_hook=no_duplicates)
          print("no duplicate keys")
          EOF
