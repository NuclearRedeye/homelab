name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grimlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      # Proves the config evaluates and every package resolves. Does not
      # exercise the Pi-hole image, which is just a string in compose.yaml.
      - name: Build the grimlock closure
        run: nix build .#nixosConfigurations.grimlock.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse both into a matrix keyed by hostname.
  snarl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the snarl closure
        run: nix build .#nixosConfigurations.snarl.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse the host jobs into a matrix keyed by hostname.
  swoop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the swoop closure
        run: nix build .#nixosConfigurations.swoop.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse the host jobs into a matrix keyed by hostname.
  slag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the slag closure
        run: nix build .#nixosConfigurations.slag.config.system.build.toplevel

  # Checks kubernetes/ as Flux will build it, so a Renovate chart bump is
  # validated against that chart's own CRDs.
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate kubernetes/
        run: nix develop -c scripts/validate.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # find rather than a glob, so a missing directory doesn't fail the job.
      - name: Lint shell scripts
        run: nix develop -c find scripts .githooks -type f \( -name '*.sh' -o -path '.githooks/*' \) -exec shellcheck -x {} +
