name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grimlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      # Proves the config evaluates and every package resolves. Does not
      # exercise the Pi-hole image, which is just a string in compose.yaml.
      - name: Build the grimlock closure
        run: nix build .#nixosConfigurations.grimlock.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse both into a matrix keyed by hostname.
  snarl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the snarl closure
        run: nix build .#nixosConfigurations.snarl.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse the host jobs into a matrix keyed by hostname.
  swoop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the swoop closure
        run: nix build .#nixosConfigurations.swoop.config.system.build.toplevel

  # FIXME(#23): Duplicates the grimlock job; collapse the host jobs into a matrix keyed by hostname.
  slag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      - name: Build the slag closure
        run: nix build .#nixosConfigurations.slag.config.system.build.toplevel
