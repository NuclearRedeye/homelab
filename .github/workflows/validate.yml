name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grimlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      # Proves the config evaluates and every package resolves. Does not
      # exercise the Pi-hole image, which is just a string in compose.yaml.
      - name: Build the grimlock closure
        run: nix build .#nixosConfigurations.grimlock.config.system.build.toplevel
