name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grimlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake outputs
        run: nix flake check

      # Proves the config evaluates and every package resolves. Does not
      # exercise the Pi-hole image, which is just a string in compose.yaml.
      - name: Build the grimlock closure
        run: nix build .#nixosConfigurations.grimlock.config.system.build.toplevel
