# Writes known test data once, with a checksum list to compare restores against.
apiVersion: batch/v1
kind: Job
metadata:
  name: writer
  namespace: backup-spike
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: writer
        # Not tracked by Renovate; the app is removed in #170.
        image: busybox:1.37.0
        command:
        - sh
        - -euc
        - |
          cd /data
          [ -f MANIFEST.sha256 ] && exit 0
          mkdir small
          i=0
          while [ "$i" -lt 1000 ]; do head -c 4096 /dev/urandom > "small/$i"; i=$((i + 1)); done
          head -c 536870912 /dev/urandom > large
          find small large -type f | sort | xargs sha256sum > MANIFEST.sha256
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
