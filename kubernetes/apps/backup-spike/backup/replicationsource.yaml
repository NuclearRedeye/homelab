apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: data
  namespace: backup-spike
spec:
  sourcePVC: data
  trigger:
    manual: first
  restic:
    repository: data-restic
    copyMethod: Clone
    storageClassName: linstor-volsync
    cacheStorageClassName: linstor-volsync
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    moverVolumes:
    - mountPath: ssh
      volumeSource:
        secret:
          secretName: known-hosts
