# Throwaway: proves the VolSync component backs up and restores a LINSTOR volume (#162, #163).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-spike
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/backup-spike/app
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: piraeus-config
  - name: settings
  - name: volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      APP: backup-spike
      VOLSYNC_CLAIM: data
      VOLSYNC_CAPACITY: 2Gi
    substituteFrom:
    - kind: ConfigMap
      name: cluster-flags
