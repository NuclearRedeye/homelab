# Fails if any restored file differs from what the writer recorded.
apiVersion: batch/v1
kind: Job
metadata:
  name: verifier
  namespace: backup-spike
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: verifier
        # Not tracked by Renovate; the app is removed in #170.
        image: busybox:1.37.0
        command:
        - sh
        - -euc
        - |
          cd /data
          sha256sum -c MANIFEST.sha256 | grep -v ': OK$' || true
          sha256sum -c -s MANIFEST.sha256
          echo "all $(wc -l < MANIFEST.sha256) files match"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: restored
