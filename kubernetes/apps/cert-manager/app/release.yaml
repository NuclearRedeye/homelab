# Gateway-shim stays off (the chart default); certificates are explicit Certificate objects.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    # keep: true so a bad release can't delete the CRDs, and every Certificate with them.
    crds:
      enabled: true
      keep: true
    # Split-horizon LAN DNS hides the public zone; check challenges over DoH instead.
    dns01RecursiveNameservers: https://1.1.1.1/dns-query,https://8.8.8.8/dns-query
    dns01RecursiveNameserversOnly: true
