# The VIP comes from cluster-settings. Flux reaches the API through the
# in-cluster Service, so this installs fine before the VIP exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-vip
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/kube-vip/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: settings
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-settings
