apiVersion: piraeus.io/v1
kind: LinstorCluster
metadata:
  name: linstorcluster
spec:
  # No overcommit: promised volume sizes can't exceed the pool.
  properties:
  - name: MaxOversubscriptionRatio
    value: "1"
  # KiB/s. Resync floor while apps write: 10MiB/s is under a tenth of the shared 1GbE port (#140).
  - name: DrbdOptions/PeerDevice/c-min-rate
    value: "10240"
  internalTLS:
    certManager:
      name: linstor-internal-ca
      kind: Issuer
  # Replaces the operator's JAVA_OPTS, so its TLS flag must stay. Sizes from #121.
  controller:
    podTemplate:
      spec:
        containers:
        - name: linstor-controller
          env:
          - name: JAVA_OPTS
            value: -Djdk.tls.acknowledgeCloseNotify=true -Xmx512m
