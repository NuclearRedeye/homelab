apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: internal-tls
spec:
  internalTLS:
    certManager:
      name: linstor-internal-ca
      kind: Issuer
---
# Replicate on the node IPs, which k3s puts on the cluster VLAN. Switching back needs reboots.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: host-network
spec:
  podTemplate:
    spec:
      hostNetwork: true
---
# NixOS provides DRBD 9 and the dm-* modules (nixos/modules/drbd.nix).
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: no-loader
spec:
  podTemplate:
    spec:
      initContainers:
      - name: drbd-module-loader
        $patch: delete
---
# Replaces the operator's JAVA_OPTS, so its TLS flag must stay. Sizes from #121.
apiVersion: piraeus.io/v1
kind: LinstorSatelliteConfiguration
metadata:
  name: heap
spec:
  podTemplate:
    spec:
      containers:
      - name: linstor-satellite
        env:
        - name: JAVA_OPTS
          value: -Djdk.tls.acknowledgeCloseNotify=true -Xmx256m -XX:+ExitOnOutOfMemoryError
