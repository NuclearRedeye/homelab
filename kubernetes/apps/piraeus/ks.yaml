apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/piraeus/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# Separate from the install so the CRDs exist before the cluster is applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: piraeus-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/piraeus/config
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: piraeus
  - name: cert-manager
