# Throwaway app proving Flux reconciles this repo; removed by #70.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smoke-test
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/smoke-test/app
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: settings
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-settings
