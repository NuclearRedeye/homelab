# CRDs only, so VolSync can start; the snapshot controller and VolumeSnapshotClass wait on #135.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: snapshot-crds
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-csi/external-snapshotter
  ref:
    tag: v8.7.1
  ignore: |
    /*
    !/client/config/crd/
---
# prune: false so removing this can never delete the CRDs, and every snapshot with them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-crds
  namespace: flux-system
spec:
  interval: 10m
  path: ./client/config/crd
  prune: false
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: snapshot-crds
