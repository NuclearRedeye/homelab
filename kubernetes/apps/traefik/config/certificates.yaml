# Codenames stand in for the real domains; see docs/runbooks/homelab-domains.md.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cybertron
  namespace: traefik
spec:
  secretName: cybertron-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
  - ${CYBERTRON_DOMAIN}
  - "*.${CYBERTRON_DOMAIN}"
---
