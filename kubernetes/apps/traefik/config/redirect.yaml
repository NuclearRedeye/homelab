# No port set, so the redirect uses https' well-known 443 rather than the listener's 8000.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: traefik
  # Only redirects to HTTPS; each HTTPS route does its own auth.
  annotations:
    homelab/public: "true"
spec:
  parentRefs:
  - name: traefik
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
