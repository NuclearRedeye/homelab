apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/traefik/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
  - name: gateway-api
  - name: settings
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-settings
