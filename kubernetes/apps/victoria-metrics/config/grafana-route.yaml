apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: victoria-metrics
spec:
  parentRefs:
  - name: traefik
    namespace: traefik
    sectionName: https-cybertron
  hostnames:
  - grafana.${CYBERTRON_DOMAIN}
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: forward-auth
    backendRefs:
    - name: victoria-metrics-grafana
      port: 80
