apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/volsync/app
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # VolSync crash-loops at startup without the VolumeSnapshot CRDs, even when only cloning.
  dependsOn:
  - name: snapshot-crds
