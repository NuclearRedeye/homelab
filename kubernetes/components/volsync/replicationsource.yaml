# See docs/requirements/backups.md for the schedule (BAK-003) and retention (BAK-004).
# scripts/ copy these restic settings into the resources in templates/, so keep them in step.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${VOLSYNC_CLAIM:=${APP}}-nas
  namespace: ${APP}
spec:
  sourcePVC: ${VOLSYNC_CLAIM:=${APP}}
  paused: ${VOLSYNC_PAUSED}
  trigger:
    schedule: "0 1 * * *"
  restic:
    repository: ${VOLSYNC_CLAIM:=${APP}}-volsync-nas
    copyMethod: Clone
    storageClassName: linstor-volsync
    cacheStorageClassName: linstor-volsync
    cacheCapacity: ${VOLSYNC_CACHE_CAPACITY:=1Gi}
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: ${VOLSYNC_UID:=1000}
      runAsGroup: ${VOLSYNC_GID:=1000}
      fsGroup: ${VOLSYNC_GID:=1000}
      seccompProfile:
        type: RuntimeDefault
    moverVolumes:
    - mountPath: volsync-nas
      volumeSource:
        secret:
          secretName: ${VOLSYNC_CLAIM:=${APP}}-volsync-nas-ssh
---
# Staggered an hour after nas so a failure at one target doesn't affect the other.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: ${VOLSYNC_CLAIM:=${APP}}-cloud
  namespace: ${APP}
spec:
  sourcePVC: ${VOLSYNC_CLAIM:=${APP}}
  paused: ${VOLSYNC_PAUSED}
  trigger:
    schedule: "0 2 * * *"
  restic:
    repository: ${VOLSYNC_CLAIM:=${APP}}-volsync-cloud
    copyMethod: Clone
    storageClassName: linstor-volsync
    cacheStorageClassName: linstor-volsync
    cacheCapacity: ${VOLSYNC_CACHE_CAPACITY:=1Gi}
    retain:
      daily: 7
      weekly: 4
      monthly: 6
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: ${VOLSYNC_UID:=1000}
      runAsGroup: ${VOLSYNC_GID:=1000}
      fsGroup: ${VOLSYNC_GID:=1000}
      seccompProfile:
        type: RuntimeDefault
    moverVolumes:
    - mountPath: volsync-cloud
      volumeSource:
        secret:
          secretName: ${VOLSYNC_CLAIM:=${APP}}-volsync-cloud-ssh
