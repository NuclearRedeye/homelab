# Applied by run_restic in scripts/libs/volsync.sh, not Flux. restic's arguments and the
# ReplicationSource's Secret, volumes and security context are added, so they aren't repeated here.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: ${REPLICATION_SOURCE}-restic-
  namespace: ${APP}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  # Backstop in case the script is killed before it deletes the Job.
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: restic
        image: ${RESTIC_IMAGE}
        # No cache volume. Reads skip the lock so they don't block a backup; restic ignores --no-lock for writes.
        command: [restic, --no-cache, --no-lock]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
