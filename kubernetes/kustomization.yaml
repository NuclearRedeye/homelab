# Entry point for the flux-system Kustomization. List each app's ks.yaml,
# never its app/ dir, so every app reconciles and fails on its own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- flux-system
- settings/ks.yaml
- apps/cert-manager/ks.yaml
- apps/gateway-api/ks.yaml
- apps/guardrails/ks.yaml
- apps/metallb/ks.yaml
- apps/traefik/ks.yaml
