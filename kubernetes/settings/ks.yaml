# Shared values for postBuild.substituteFrom, kept encrypted so LAN details
# stay out of this public repo. Apps using them add dependsOn: settings.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: settings
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/settings/app
  prune: true
  wait: true
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
